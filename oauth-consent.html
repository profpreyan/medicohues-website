<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedicoHues – Authorize MCP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 24px; background: #f7f9fc; }
    .card { background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #555; font-size: .95rem; }
    label { display: block; margin: 14px 0 4px; font-weight: 500; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; margin-top: 18px; padding: 12px; background: #1565c0; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; }
    .err { color: #c62828; margin-top: 10px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Authorize MedicoHues MCP</h1>
    <p>Sign in with your admin credentials to allow this AI assistant to manage your website content.</p>
    <form id="f">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="username">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button type="submit">Sign in & Authorize</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient('https://oyehwvvpsdpkhpbtoylb.supabase.co', 'sb_publishable_HEY-CuAb3JqyaXmWlzrakg_3CfjZAqD');
    const params = new URLSearchParams(location.search);
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({
        email: e.target.email.value,
        password: e.target.password.value,
      });
      if (error) {
        document.getElementById('err').textContent = error.message;
        btn.disabled = false;
        return;
      }
      const redirect = params.get('redirect_uri') || '/admin/';
      location.href = redirect + (redirect.includes('?') ? '&' : '?') + 'mcp_authorized=1';
    };
  </script>
</body>
</html>
