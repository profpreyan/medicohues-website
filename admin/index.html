<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | MedicoHues</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- AUTH -->
<section class="auth" id="auth" hidden>
  <form class="auth-card" id="auth-form">
    <img src="../assets/logo-horizontal.png" alt="MedicoHues" class="auth-logo">
    <h1 id="auth-title">Sign in to your dashboard</h1>
    <p class="muted" id="auth-sub">Manage enquiries, products, articles and more.</p>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label id="pw-wrap">Password<input type="password" name="password" minlength="8" autocomplete="current-password"></label>
    <button class="btn" type="submit" id="auth-btn">Sign in</button>
    <p class="auth-msg" id="auth-msg"></p>
    <div class="auth-links">
      <a href="#" data-mode="signup">First time? Create your account</a>
      <a href="#" data-mode="reset">Forgot password?</a>
      <a href="#" data-mode="signin" hidden>Back to sign in</a>
    </div>
  </form>
</section>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side-logo" href="#overview"><img src="../assets/logo-horizontal.png" alt="MedicoHues"></a>
    <nav id="side-nav"></nav>
    <div class="side-foot">
      <a href="../" target="_blank" class="side-link">↗ View website</a>
      <button class="side-link" id="logout">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <h1 id="page-title">Overview</h1>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- side panel for editing -->
<div class="panel-bg" id="panel-bg" hidden>
  <aside class="panel" id="panel"></aside>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../supa.js"></script>
<script src="admin.js"></script>
</body>
</html>
